name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Perl dependencies
        run: sudo apt-get update && sudo apt-get install -y libppi-perl libperl-critic-perl

      - name: Build debashc
        run: cargo build -p debashcl --bin debashc

      - name: Run main (cargo) tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee cargo_test_output.txt || true

      - name: Run purify tests
        run: |
          perl test_purify.pl --all 2>&1 | tee purify_output.txt || true

      - name: Run perl-critic checks on generated code
        run: |
          set -o pipefail
          ./target/debug/debashc fail --perl-critic 2>&1 | tee perlcritic_output.txt

      - name: Generate badge JSON
        # Run even when a test step failed — a red run must still refresh
        # the badges (that is exactly when they need to change).
        if: ${{ !cancelled() }}
        run: |
          set -eu

          # If the test output files are missing (for example an earlier step
          # failed or was skipped), run the tests here as a fallback so the
          # badges reflect actual results.
          if [ ! -f cargo_test_output.txt ]; then
            echo "cargo_test_output.txt missing — running cargo test (fallback)"
            set -o pipefail
            cargo test 2>&1 | tee cargo_test_output.txt || true
          fi
          if [ ! -f purify_output.txt ]; then
            echo "purify_output.txt missing — running purify tests (fallback)"
            perl test_purify.pl --all 2>&1 | tee purify_output.txt || true
          fi

          # Parse cargo test output for passed/failed/ignored/measured
          main_passed=0
          main_failed=0
          main_ignored=0
          main_measured=0
          main_total=0
          if [ -f cargo_test_output.txt ]; then
            # Sum numbers across all "test result:" lines because cargo prints
            # one per test target. We want totals for the whole run, not a
            # single target's summary.
            # Use -0777 (slurp) so the entire file is in $_ and a global /g
            # match collects every "test result:" line without any nested
            # while-loop / stdin-fallback issues.
            summed=$(perl -0777 -ne '
              my ($p,$f,$i,$m) = (0,0,0,0);
              while (/test result:.*?(\d+)\s+passed.*?(\d+)\s+failed.*?(\d+)\s+ignored.*?(\d+)\s+measured/g) {
                $p += $1; $f += $2; $i += $3; $m += $4;
              }
              print "$p $f $i $m\n";
            ' cargo_test_output.txt || true)
            if [ -n "$summed" ]; then
              # Read summed values into variables
              IFS=' ' read -r main_passed main_failed main_ignored main_measured <<< "$summed"
              main_passed=${main_passed:-0}
              main_failed=${main_failed:-0}
              main_ignored=${main_ignored:-0}
              main_measured=${main_measured:-0}
              main_total=$((main_passed + main_failed + main_ignored + main_measured))
            fi
          fi
          main_passed=${main_passed:-0}
          main_total=${main_total:-0}
          if [ "${main_failed:-0}" -ne 0 ]; then
            color_main=red
          elif [ "$main_total" -eq 0 ]; then
            color_main=lightgrey
          else
            color_main=brightgreen
          fi

          # Parse purify output
          purify_passed=0
          purify_failed=0
          purify_tested=0
          if [ -f purify_output.txt ]; then
            line=$(grep -E '^Purify.pl tests:' purify_output.txt | tail -n1 || true)
            if [ -n "$line" ]; then
              purify_passed=$(echo "$line" | perl -nle 'print $1 if /Purify.pl tests: (\d+) passed/') || true
              purify_failed=$(echo "$line" | perl -nle 'print $1 if /, (\d+) failed/') || true
              purify_tested=$(echo "$line" | perl -nle 'print $1 if /(\d+) tested$/') || true
            else
              # Fallback: if the final summary wasn't printed (the script died on
              # the first failure), estimate counts from PASSED:/FAILED: lines.
              purify_passed=$(grep -c '^PASSED:' purify_output.txt || true)
              purify_failed=$(grep -c '^FAILED:' purify_output.txt || true)
              purify_tested=$((purify_passed + purify_failed))
            fi
          fi
          purify_passed=${purify_passed:-0}
          purify_tested=${purify_tested:-0}
          if [ "${purify_failed:-0}" -ne 0 ]; then
            color_purify=red
          elif [ "$purify_tested" -eq 0 ]; then
            color_purify=lightgrey
          else
            color_purify=brightgreen
          fi

          mkdir -p .github/badges
          if [ "$main_total" -eq 0 ]; then
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"main tests\", \"message\": \"no tests run\", \"color\": \"${color_main}\"}" > .github/badges/main-tests.json
          else
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"main tests\", \"message\": \"${main_passed}/${main_total} passed\", \"color\": \"${color_main}\"}" > .github/badges/main-tests.json
          fi

          if [ "$purify_tested" -eq 0 ]; then
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"purify tests\", \"message\": \"no tests run\", \"color\": \"${color_purify}\"}" > .github/badges/purify.json
          else
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"purify tests\", \"message\": \"${purify_passed}/${purify_tested} passed\", \"color\": \"${color_purify}\"}" > .github/badges/purify.json
          fi

          # Parse the corpus runner's final summary line
          # ("TESTS COMPLETED: X passed, Y failed out of Z")
          corpus_passed=0
          corpus_failed=0
          corpus_total=0
          if [ -f perlcritic_output.txt ]; then
            corpus_line=$(grep -E '^TESTS COMPLETED:' perlcritic_output.txt | tail -n1 || true)
            if [ -n "$corpus_line" ]; then
              corpus_passed=$(echo "$corpus_line" | perl -nle 'print $1 if /TESTS COMPLETED: (\d+) passed/') || true
              corpus_failed=$(echo "$corpus_line" | perl -nle 'print $1 if /, (\d+) failed/') || true
              corpus_total=$(echo "$corpus_line" | perl -nle 'print $1 if /out of (\d+)/') || true
            fi
          fi
          corpus_passed=${corpus_passed:-0}
          corpus_failed=${corpus_failed:-0}
          corpus_total=${corpus_total:-0}
          if [ "$corpus_total" -eq 0 ]; then
            color_corpus=lightgrey
          elif [ "$corpus_failed" -ne 0 ]; then
            color_corpus=orange
          else
            color_corpus=brightgreen
          fi
          if [ "$corpus_total" -eq 0 ]; then
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"corpus\", \"message\": \"no tests run\", \"color\": \"${color_corpus}\"}" > .github/badges/corpus.json
          else
            printf '%s\n' "{\"schemaVersion\": 1, \"label\": \"corpus\", \"message\": \"${corpus_passed}/${corpus_total} passed\", \"color\": \"${color_corpus}\"}" > .github/badges/corpus.json
          fi

      - name: Commit badges to gh-pages
        # !cancelled(): badges must land on gh-pages even when a test step
        # failed — otherwise a red run leaves the badges frozen at the last
        # green run's numbers.
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The test steps dirty the main checkout (regenerated
          # examples.out/*.pl, debug_perl_code.pl, …) and gh-pages carries
          # some of those same paths, so switching branches in this tree
          # aborts with "local changes would be overwritten". Commit from a
          # separate WORKTREE instead — the dirty checkout is never touched.
          git fetch origin gh-pages || true
          WT=$(mktemp -d)
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add --force "$WT" -B gh-pages origin/gh-pages
          else
            git worktree add --force --detach "$WT"
            git -C "$WT" checkout --orphan gh-pages
            git -C "$WT" rm -rf --quiet . || true
          fi

          mkdir -p "$WT/.github/badges"
          cp .github/badges/*.json "$WT/.github/badges/"

          cd "$WT"
          git add .github/badges/*.json
          if git diff --cached --quiet; then
            echo "No changes to badges, nothing to commit"
          else
            git commit -m "Update test badges"
            git push origin gh-pages
          fi
          cd - >/dev/null
          git worktree remove --force "$WT" || true
