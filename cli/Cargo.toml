[package]
name = "debashcl"
version = "0.1.0"
edition = "2021"

# CLI layer: debashcl (library of CLI logic) wraps debashl (transpiler core);
# the debashc binary is a 3-line main over debashcl::main_with_args.

[[bin]]
name = "debashc"
path = "src/main.rs"

[lib]
name = "debashcl"
path = "src/lib.rs"

[dependencies]
debashl = { path = ".." }
lazy_static = "1.4"
md5 = "0.8"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
