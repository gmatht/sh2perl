[package]
name = "debashcl"
version = "0.1.0"
edition = "2021"

# CLI layer: debashcl (library of CLI logic) wraps debashl (transpiler core);
# the debashc binary is a 3-line main over debashcl::main_with_args.
#
# The `wasi-cli` feature compiles the same CLI layer as a WASI *reactor*
# (cli/src/wasi_api.rs): `debashc_cli_run(argc, argv)` runs the full
# command-line processing from any embedder, so debashc can be implemented
# in three lines of JS (see cli/example-wasi.mjs and build-wasi.sh).

[[bin]]
name = "debashc"
path = "src/main.rs"

[lib]
name = "debashcl"
path = "src/lib.rs"
# cdylib so `--features wasi-cli --lib` produces an instantiable .wasm
# (rlib-only crate-types build no wasm module with exports).
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasi-cli = []

[dependencies]
debashl = { path = ".." }
lazy_static = "1.4"
md5 = "0.8"
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
